name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  promote:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Extract version and promote release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_HEAD_REF#release/}
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          TAG="v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure package.json is at the right version on main
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: bump version to ${VERSION}"
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/main" \
              -f sha="$(git rev-parse HEAD)" \
              -F force=true
          fi

          # Move tag to the HEAD of main
          SHA=$(git rev-parse HEAD)
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$TAG" \
              -f sha="$SHA" \
              -F force=true
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$SHA"
          fi

          # Promote the pre-release to a full published release marked as latest
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0].id")
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "No release found for $TAG — nothing to promote"
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=false \
            -F make_latest=true
          echo "Promoted $TAG to latest release"
