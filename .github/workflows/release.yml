name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, for example v1.8.9'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # A release tag is immutable. Serialising releases prevents concurrent jobs
  # from uploading conflicting updater manifests to the same GitHub Release.
  group: release-${{ github.event.pull_request.number || inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    # A merged, same-repository release branch is trusted. Fork PRs and normal
    # feature PRs never receive release permissions or Apple credentials.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout merged release
        uses: actions/checkout@v4
        with:
          # Manual retries start from the immutable tag, not from whatever
          # commit main happens to point at when the button is pressed.
          ref: ${{ inputs.tag || github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 1

      - name: Resolve version and create immutable draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="v${RELEASE_BRANCH#release/v}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the format vX.Y.Z; received: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"

          SHA=$(git rev-parse HEAD)
          if EXISTING_SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null); then
            if [ "$EXISTING_SHA" != "$SHA" ]; then
              echo "Refusing to move immutable tag $TAG (existing: $EXISTING_SHA, requested: $SHA)"
              exit 1
            fi
          else
            gh api -X POST "repos/${{ github.repository }}/git/refs" \
              -f "ref=refs/tags/$TAG" -f "sha=$SHA"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --generate-notes --target "$SHA"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set package version from release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build
      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify Windows updater manifest
        shell: bash
        run: |
          set -euo pipefail
          UPDATER_FILE=$(sed -n 's/^path: //p' release/latest.yml | head -n 1)
          test -n "$UPDATER_FILE"
          test -f "release/$UPDATER_FILE"
          test -f "release/$UPDATER_FILE.blockmap"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  build-macos:
    needs: prepare
    # Keep this runner pinned instead of inheriting a changing macos-latest image.
    runs-on: macos-14
    environment: production-release
    timeout-minutes: 45
    env:
      # The runner context is unavailable at job scope. The run ID keeps these
      # ephemeral paths unique on the GitHub-hosted macOS runner.
      KEYCHAIN_PATH: /tmp/worktracker-signing-${{ github.run_id }}.keychain-db
      CERTIFICATE_PATH: /tmp/worktracker-signing-${{ github.run_id }}.p12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set package version from release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm run build

      - name: Import and verify Developer ID certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          printf '%s' "$CSC_LINK" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*\"\(Developer ID Application:.*\)\"/\1/p' | head -n 1)
          test -n "$IDENTITY"
          # electron-builder chooses the Developer ID certificate class itself;
          # its CSC_NAME must contain only the certificate's subject suffix.
          echo "CSC_NAME=${IDENTITY#Developer ID Application: }" >> "$GITHUB_ENV"
          echo "Imported Developer ID Application certificate."

      - name: Package, sign, and notarize macOS app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # This workflow only reaches this job after a same-repository
          # release/* PR has merged, with environment approval. electron-builder
          # otherwise treats the closed pull_request event as untrusted and
          # silently skips the certificate imported above.
          CSC_FOR_PULL_REQUEST: 'true'
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Verify signing and notarization
        run: |
          set -euo pipefail
          APP_PATH=$(find release -maxdepth 3 -type d -name '*.app' -print -quit)
          DMG_PATH=$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          # electron-builder notarizes and staples the app bundle. The DMG is
          # only a container for that already-notarized app, so it has no
          # separate ticket unless we submit the finished image independently.
          hdiutil imageinfo "$DMG_PATH" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$CERTIFICATE_PATH"

  publish:
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          find packages -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG after both platform builds passed."
